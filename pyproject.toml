[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verification-first-harness"
version = "0.3.0a1"
description = "A verification-first control plane that prevents unverified agent claims from propagating."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "multi-agent", "verification", "reliability", "trust-gate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/wenxiangyuan611-hash/verification-first-harness"
Repository = "https://github.com/wenxiangyuan611-hash/verification-first-harness"
Issues = "https://github.com/wenxiangyuan611-hash/verification-first-harness/issues"
Changelog = "https://github.com/wenxiangyuan611-hash/verification-first-harness/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
verification-harness-demo = "verification_harness.main:main"
verification-harness-runtime = "verification_harness.runtime_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verification_harness = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=verification_harness --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["verification_harness"]
omit = [
  "*/demo_task.py",
  "*/main.py",
  "*/runtime_cli.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
packages = ["verification_harness"]
mypy_path = "src"
